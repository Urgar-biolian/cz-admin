# 生产环境配置
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/official_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: ${DB_USERNAME:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    password: ${DB_PASSWORD:123456}
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

# 飞书应用配置
lark:
  app:
    id: ${LARK_APP_ID:your_lark_app_id}
    secret: ${LARK_APP_SECRET:your_lark_app_secret}

# 日志配置
logging:
  level:
    com.cz.admin: INFO
    com.lark.oapi: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"